<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Dog Groom Room | Pet Spa Stanley</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-panel {
            background: rgba(6, 28, 23, 0.8);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
        .glass-active {
            background: linear-gradient(135deg, rgba(6, 95, 70, 0.4) 0%, rgba(6, 28, 23, 0.9) 100%);
            border: 1px solid rgba(16, 185, 129, 0.6);
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.2);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased min-h-screen pb-12">
    <header class="sticky top-0 z-50 glass-panel border-b border-emerald-950 px-4 py-3.5">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-sm font-black tracking-wider text-emerald-100">THE DOG GROOM ROOM</h1>
                <p class="text-[10px] text-emerald-400 font-bold uppercase tracking-widest">High Street, Stanley</p>
            </div>
            <a href="tel:01207239575" class="bg-emerald-500/20 text-emerald-300 text-xs px-3.5 py-2 rounded-xl font-bold border border-emerald-500/40">
                <i class="fa-solid fa-phone"></i> Call
            </a>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 mt-5 space-y-5">
        <div class="glass-panel p-6 rounded-3xl text-center space-y-3">
            <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 text-[10px] font-bold px-3 py-1 rounded-full uppercase tracking-widest">
                <i class="fa-solid fa-star text-amber-400"></i> 4.9 Star Rated Spa (240+ Reviews)
            </span>
            <h2 class="text-2xl font-black text-emerald-100 uppercase tracking-tight">Gentle Care,<br><span class="text-emerald-400">Happy Tails.</span></h2>
            <p class="text-xs text-slate-400">Select your dog breed size below for instant package pricing and deposit booking.</p>
        </div>

        <div class="space-y-3">
            <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Dog Size</span>
            <div class="grid grid-cols-3 gap-2">
                <button onclick="setSize(1.0, 's')" id="size-s" class="glass-active p-3 rounded-2xl flex flex-col items-center">
                    <i class="fa-solid fa-dog text-emerald-400 text-lg mb-1"></i>
                    <span class="text-xs font-bold">Small</span>
                    <span class="text-[10px] text-slate-400">e.g. Pug</span>
                </button>
                <button onclick="setSize(1.2, 'm')" id="size-m" class="glass-panel p-3 rounded-2xl flex flex-col items-center">
                    <i class="fa-solid fa-dog text-slate-500 text-lg mb-1"></i>
                    <span class="text-xs font-bold">Medium</span>
                    <span class="text-[10px] text-slate-400">e.g. Spaniel</span>
                </button>
                <button onclick="setSize(1.4, 'l')" id="size-l" class="glass-panel p-3 rounded-2xl flex flex-col items-center">
                    <i class="fa-solid fa-dog text-slate-500 text-lg mb-1"></i>
                    <span class="text-xs font-bold">Large</span>
                    <span class="text-[10px] text-slate-400">e.g. Lab</span>
                </button>
            </div>
        </div>

        <div class="glass-panel p-5 rounded-3xl space-y-4 border-emerald-500/30">
            <div class="flex justify-between items-center pb-3 border-b border-slate-800">
                <div>
                    <p class="text-[11px] text-slate-400">Full Groom Total</p>
                    <p id="total" class="text-2xl font-black text-white">£35.00</p>
                </div>
                <div class="text-right">
                    <p class="text-[11px] text-emerald-400 font-bold">Deposit Due (25%)</p>
                    <p id="deposit" class="text-2xl font-black text-emerald-400">£8.75</p>
                </div>
            </div>
            <form onsubmit="event.preventDefault(); alert('Demo request submitted!');" class="space-y-2.5">
                <input type="text" placeholder="Dog's Name & Breed" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white outline-none focus:border-emerald-500">
                <input type="tel" placeholder="Owner's WhatsApp Number" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white outline-none focus:border-emerald-500">
                <button type="submit" class="w-full bg-emerald-600 text-white font-bold py-3.5 rounded-xl text-xs uppercase tracking-wider shadow-lg shadow-emerald-600/30">
                    Book Grooming Session
                </button>
            </form>
        </div>
    </main>

    <script>
        let mult = 1.0;
        function setSize(m, id) {
            mult = m;
            document.querySelectorAll('[id^="size-"]').forEach(btn => {
                btn.className = 'glass-panel p-3 rounded-2xl flex flex-col items-center';
                btn.querySelector('i').className = 'fa-solid fa-dog text-slate-500 text-lg mb-1';
            });
            const active = document.getElementById('size-' + id);
            active.className = 'glass-active p-3 rounded-2xl flex flex-col items-center';
            active.querySelector('i').className = 'fa-solid fa-dog text-emerald-400 text-lg mb-1';
            const tot = 35 * mult;
            document.getElementById('total').innerText = '£' + tot.toFixed(2);
            document.getElementById('deposit').innerText = '£' + (tot * 0.25).toFixed(2);
        }
    </script>
</body>
</html>
